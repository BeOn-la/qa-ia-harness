name: Verify harness
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Install pinned build tools and wheel
        run: |
          python -m pip install setuptools==80.9.0 wheel==0.45.1
          python -m pip wheel --no-build-isolation --no-deps --wheel-dir dist .
          python -m pip install --no-index --find-links dist qa-ia-harness==0.1.0
      - name: Test adversarial cases
        run: python -m unittest discover -s tests -v
      - name: Verify API good and faulty variants
        run: python examples/verify.py api
      - name: Add QA evidence to job summary
        if: always()
        shell: bash
        run: |
          if test -d examples/api/.qa-runs; then
            find examples/api/.qa-runs -name report.md -exec cat {} \; >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: qa-api-${{ matrix.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: examples/api/.qa-runs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  sql-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Install pinned build tools and wheel
        run: |
          python -m pip install setuptools==80.9.0 wheel==0.45.1
          python -m pip wheel --no-build-isolation --no-deps --wheel-dir dist .
          python -m pip install --no-index --find-links dist qa-ia-harness==0.1.0
      - name: Verify isolated SQL Server fixture and cleanup
        run: python examples/sql/run_disposable.py
      - name: Preserve SQL evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: qa-sql-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: examples/sql/.qa-runs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
