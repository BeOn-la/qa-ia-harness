[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-ia-harness"
version = "0.1.0"
description = "QA reproducible, trazable y sin dependencia de IA durante la ejecucion"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
sqlserver = ["pyodbc>=5.1,<6"]

[project.scripts]
qa-harness = "qa_harness.cli:main"

[tool.setuptools]
packages = ["qa_harness", "qa_harness.schemas"]
package-dir = {qa_harness = "src/qa_harness", "qa_harness.schemas" = "schemas"}

[tool.setuptools.package-data]
"qa_harness.schemas" = ["*.json"]
